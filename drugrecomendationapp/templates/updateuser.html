<!doctype html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="">
    <meta name="author" content="">

    <title>Drug Recommender</title>

    <!-- CSS FILES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">

    <link href="/static/css/bootstrap-icons.css" rel="stylesheet">

    <link href="/static/css/tooplate-crispy-kitchen.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .dropdown {
            float: left;
            overflow: hidden;
        }

        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: rgba(14, 10, 10, 0.633);
            padding: 14px 16px;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }

        /* .navbar a:hover, .dropdown:hover .dropbtn {
          background-color: red;
        } */

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #0B2A4A6a;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(246, 244, 244, 0.958);
            z-index: 1;
        }

        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #1F6FEB33;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-lg">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand" href="#">
                <span class="brand-icon">✚</span>
                <span>Drug Recommender</span>
            </a>

          

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                       <li class="nav-item">
                        <a class="nav-link active" href="/userhome/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/userupdate/">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/vmedicine/">Medicines</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/doctorlist/">Doctors</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="/givefeedback/">Add Review</a>
                    </li>
                   
                </ul>
            </div>


            <div class="d-none d-lg-block">
                <a href="/logout/" class="custom-btn btn btn-danger" style="color: white;">Logout</a>
            </div>

        </div>
    </nav>

    <main>

        <header class="site-header site-contact-header">
            <div class="container">
                <div class="row">

                    <div class="col-lg-10 col-12 mx-auto">
                        <h1 class="text-white">Profile</h1>

                        <strong class="text-white"></strong>
                    </div>

                </div>
            </div>

            <div class="overlay"></div>
        </header>

        <section class="contact section-padding">
            <div class="container">
                <div class="row">



                    <div class="col-lg-12 col-9">
                        <center>
                                
                            <div class="col-lg-9 col-9">
                                <form class="custom-form contact-form row" action="/userupdation1/" method="POST" role="form">{% csrf_token %}
                                    {% for n in tk %}
                                    <input type="hidden" name="id" value="{{ n.uid }}">
                            
                                    <div class="col-9">
                                        <label for="user-name" class="form-label">Name</label>
                                        <input type="text" name="name" id="user-name" class="form-control" value="{{ n.uname }}" required>
                            
                                        <label for="user-age" class="form-label">Age</label>
                                        <input type="text" name="age" id="user-age" class="form-control" value="{{ n.age }}" required>
                            
                                        <label class="form-label">Gender</label>
                                        <div>
                                            <input type="radio" name="gender" value="Male" id="gender-male" {% if n.gender == 'Male' %}checked{% endif %}>
                                            <label for="gender-male">Male</label>
                            
                                            <input type="radio" name="gender" value="Female" id="gender-female" {% if n.gender == 'Female' %}checked{% endif %}>
                                            <label for="gender-female">Female</label>
                                        </div>
                            
                                        <label for="user-place" class="form-label">Place</label>
                                        <input type="text" name="place" id="user-place" class="form-control" value="{{ n.place }}" required>
                            
                                        <label for="user-address" class="form-label">Address</label>
                                        <input type="text" name="address" id="user-address" class="form-control" value="{{ n.address }}" required>
                            
                                        <label for="user-phone" class="form-label">Phone Number</label>
                                        <input type="text" name="phone" id="user-phone" class="form-control" value="{{ n.phonenum }}" required>
                            
                                        <label for="user-email" class="form-label">Email</label>
                                        <input type="email" name="email" id="user-email" class="form-control" value="{{ n.email }}" required>
                                    </div>
                            
                                    <div class="col-lg-5 col-12 ms-auto">
                                        <button type="submit" class="form-control">Update</button>
                                    </div>
                                    {% endfor %}
                                </form>
                            </div>
                            
                        </center>
                    </div>



                </div>
            </div>
        </section>

    </main>

    {% include 'footer.html' %}

    <!-- Modal -->


    <!-- JAVASCRIPT FILES -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/custom.js"></script>

</body>

</html>
