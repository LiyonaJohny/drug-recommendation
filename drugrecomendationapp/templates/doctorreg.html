        <title>Drug Recommender</title>

        <!-- CSS FILES -->    
        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>
       
        .dropdown {
          float: left;
          overflow: hidden;
        }
        
        .dropdown .dropbtn {
          font-size: 16px;  
          border: none;
          outline: none;
          color: rgba(14, 10, 10, 0.633);
          padding: 14px 16px;
          background-color: inherit;
          font-family: inherit;
          margin: 0;
        }
        
        /* .navbar a:hover, .dropdown:hover .dropbtn {
          background-color: red;
        } */
        
        .dropdown-content {
          display: none;
          position: absolute;
          background-color: #0B2A4A6a;
          min-width: 160px;
          box-shadow: 0px 8px 16px 0px rgba(246, 244, 244, 0.958);
          z-index: 1;
        }
        
        .dropdown-content a {
          float: none;
          color: black;
          padding: 12px 16px;
          text-decoration: none;
          display: block;
          text-align: left;
        }
        
        .dropdown-content a:hover {
          background-color: #1F6FEB33;
        }
        
        .dropdown:hover .dropdown-content {
          display: block;
        }
        </style>
    </head>
    
    <body>
        
        {% include 'header.html' %}

        <main>

            <header class="site-header site-contact-header">
                <div class="container">
                    <div class="row">

                        <div class="col-lg-10 col-12 mx-auto">
                            <h1 class="text-white">Doctor Register</h1>

                            <strong class="text-white">We are happy to get in touch with you</strong>
                        </div>

                    </div>
                </div>
                
                <div class="overlay"></div>
            </header>

            <section class="contact section-padding">
                <div class="container">
                    <div class="row">

                        <!-- <div class="col-12">
                            <h2 class="mb-4">Leave a message</h2>
                        </div> -->

                        <div class="col-lg-9 col-9">
                            <form class="custom-form contact-form row" action="/doctorregistration/" method="POST" role="form">{% csrf_token %}
                        
                                <div class="col-9">
                                    <label for="doctor-name" class="form-label">Name</label>
                                    <input type="text" name="name" id="doctor-name" class="form-control" placeholder="Your Name" required>
                        
                                    <label for="doctor-specialization" class="form-label">Specialization</label>
                                    <input type="text" name="Specilization" id="doctor-specialization" class="form-control" placeholder="Your Specialization" required>
                        
                                    <label for="doctor-license" class="form-label">License Number</label>
                                    <input type="text" name="number" id="doctor-license" class="form-control" placeholder="Your License Number" required>
                        
                                    <label for="doctor-qualification" class="form-label">Qualification</label>
                                    <input type="text" name="qualification" id="doctor-qualification" class="form-control" placeholder="Your Qualification" required>
                        
                                    <label for="doctor-email" class="form-label">Email</label>
                                    <input type="email" name="email" id="doctor-email" pattern="[^ @]*@[^ @]*" class="form-control" placeholder="Your Email" required>
                        
                                    <label for="doctor-password" class="form-label">Password</label>
                                    <input type="password" name="password" id="doctor-password" class="form-control" placeholder="Your Password" required>
                                </div>
                        
                                <div class="col-lg-5 col-12 ms-auto">
                                    <button type="submit" class="form-control">Register</button>
                                </div>
                            </form>
                        </div>

                                <p class="ms-5">11:00 AM - 11:00 PM</p>

                        </div> -->

                            </div>

                    </div>
                </div>
            </section>

        </main>

        {% include 'footer.html' %}
