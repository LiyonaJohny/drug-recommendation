<!doctype html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="">
    <meta name="author" content="">

    <title>Drug Recommender</title>

    <!-- CSS FILES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">

    <link href="/static/css/bootstrap-icons.css" rel="stylesheet">

    <link href="/static/css/tooplate-crispy-kitchen.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .dropdown {
            float: left;
            overflow: hidden;
        }

        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: rgba(14, 10, 10, 0.633);
            padding: 14px 16px;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }

        /* .navbar a:hover, .dropdown:hover .dropbtn {
          background-color: red;
        } */

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #0B2A4A6a;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(246, 244, 244, 0.958);
            z-index: 1;
        }

        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #1F6FEB33;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-lg">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand" href="#">
                <span class="brand-icon">✚</span>
                <span>Drug Recommender</span>
            </a>

          

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/doctorhome/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/viewdoctor/"> View Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/userlist/">Services</a>
                    </li>
                   
                </ul>
            </div>


            <div class="d-none d-lg-block">
                <a href="/logout/" class="custom-btn btn btn-danger" style="color: white;">Logout</a>
            </div>

        </div>
    </nav>

    <main>

        <header class="site-header site-contact-header">
            <div class="container">
                <div class="row">

                    <div class="col-lg-10 col-12 mx-auto">
                        <h1 class="text-white">Doctor Updation</h1>

                        <strong class="text-white"></strong>
                    </div>

                </div>
            </div>

            <div class="overlay"></div>
        </header>

        <section class="contact section-padding">
            <div class="container">
                <div class="row">



                    <div class="col-lg-12 col-9">
                        <center>
                            <div class="container mt-4">
                                <div class="row justify-content-center">
                                    <div class="col-lg-8 col-md-10">
                                        <div class="card shadow-lg p-4">
                                            <h2 class="text-center mb-4">Update Doctor Details</h2>
                                            <form action="/doctorupdate/" method="POST">{% csrf_token %}
                                                {% for u in use %}
                                                <input type="hidden" name="id" value="{{ u.doc_id }}">
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Name</label>
                                                    <input type="text" class="form-control" name="name" value="{{ u.name }}" readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Specialization</label>
                                                    <input type="text" class="form-control" name="specilization" value="{{ u.specilization }}" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">License Number</label>
                                                    <input type="text" class="form-control" name="number" value="{{ u.number }}" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Qualification</label>
                                                    <input type="text" class="form-control" name="qualification" value="{{ u.qualification }}" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Email</label>
                                                    <input type="email" class="form-control" name="email" value="{{ u.email }}" required>
                                                </div>
                                                <div class="text-center">
                                                    <button type="submit" class="btn btn-primary w-50">Update</button>
                                                </div>
                                                {% endfor %}
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            
                        </center>
                    </div>



                </div>
            </div>
        </section>

    </main>

    {% include 'footer.html' %}

    <!-- Modal -->


    <!-- JAVASCRIPT FILES -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/custom.js"></script>

</body>

</html>
