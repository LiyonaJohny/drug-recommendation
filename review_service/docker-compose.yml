services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  review_service:
    build: .
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: drug_reviews
      MONGO_COLLECTION: reviews
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
